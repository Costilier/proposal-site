<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Koms</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #050505);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        font-family: 'Georgia', serif;
        color: #f0f0f0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        pointer-events: none;
        animation: floatUp linear infinite;
        z-index: 0;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    #intro-screen {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        z-index: 100;
        transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    #intro-screen h1 {
        font-size: 42px;
        font-weight: normal;
        letter-spacing: 2px;
        margin-bottom: 40px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .glass-btn {
        padding: 15px 40px;
        font-size: 20px;
        font-family: inherit;
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 30px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .glass-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
    }

    #slideshow-container {
        display: flex;
        width: 85%;
        height: 75vh;
        opacity: 0;
        transition: opacity 2s ease;
        z-index: 10;
        background: rgba(20, 20, 30, 0.4);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
    }

    #image-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    #image-container img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), filter 1.5s ease, transform 1.5s ease;
    }

    #text-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px;
        font-size: 32px;
        font-style: italic;
        color: #e8e8e8;
        text-align: center;
        line-height: 1.8;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    #poem-text {
        opacity: 0;
        transform: translateY(15px);
        transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), filter 1.5s ease, transform 1.5s ease, letter-spacing 1.5s ease;
    }

    .fade-out {
        opacity: 0 !important;
        filter: blur(12px) grayscale(50%);
        transform: scale(0.9) translateY(-10px) !important;
        letter-spacing: 4px;
    }
    
    .fade-in {
        opacity: 1 !important;
        filter: blur(0px) grayscale(0%);
        transform: scale(1) translateY(0) !important;
        letter-spacing: normal;
    }

    #borders {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        border: 0px solid transparent;
        transition: border 4s ease-in-out, box-shadow 4s ease-in-out;
        box-sizing: border-box;
        z-index: 20;
    }

    .grow-flowers {
        border: 60px solid transparent !important;
        border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><path d="M60 10 Q75 35 110 60 Q75 85 60 110 Q45 85 10 60 Q45 35 60 10 Z" fill="rgba(46, 139, 87, 0.4)" stroke="rgba(144, 238, 144, 0.6)" stroke-width="2"/><circle cx="60" cy="60" r="8" fill="rgba(255, 182, 193, 0.8)"/><path d="M10 10 Q30 30 60 60" stroke="rgba(46, 139, 87, 0.6)" fill="none" stroke-width="2"/><path d="M110 110 Q90 90 60 60" stroke="rgba(46, 139, 87, 0.6)" fill="none" stroke-width="2"/></svg>') 35 stretch !important;
        box-shadow: inset 0 0 50px rgba(46, 139, 87, 0.2);
    }

    #phase-two, #phase-three, #phase-four {
        position: absolute;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 2s ease;
        z-index: 30;
    }

    #phase-two h2 {
        font-size: 42px;
        color: #fff;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        margin-bottom: 40px;
    }

    #phase-two img {
        max-width: 90%; 
        max-height: 55vh;
        border-radius: 20px; 
        box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.1);
    }

    #phase-three video {
        border-radius: 20px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.1);
        background: #000;
    }

    #phase-four h1 {
        font-size: 56px;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        margin-bottom: 50px;
    }

    .btn-container {
        display: flex;
        gap: 40px;
    }

    .btn-yes {
        background: rgba(255, 105, 180, 0.6);
        border: 1px solid rgba(255, 182, 193, 0.8);
        box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    }
    
    .btn-yes:hover {
        background: rgba(255, 105, 180, 0.8);
        box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
    }
</style>
</head>
<body>

<audio id="bg-music" src="background_music.mp3" loop></audio>

<div id="particles-container"></div>

<div id="intro-screen">
    <h1>Would you like to proceed, koms?</h1>
    <button class="glass-btn" onclick="startExperience()">Proceed</button>
</div>

<div id="borders"></div>

<div id="slideshow-container">
    <div id="image-container">
        <img id="current-image" src="" alt="Koms">
    </div>
    <div id="text-container">
        <div id="poem-text"></div>
    </div>
</div>

<div id="phase-two">
    <h2>Will you be the Wooper to my Gengar?</h2>
    <img src="wobuffet_gengar.jpeg" alt="Wooper and Gengar">
</div>

<div id="phase-three">
    <video id="proposal-video" width="900" src="kukui_proposal.mp4" controls></video>
</div>

<div id="phase-four">
    <h1>So will you marry me, koms?</h1>
    <div class="btn-container">
        <button class="glass-btn btn-yes" onclick="alert('Congratulations to both of you! ❤️')">YES</button>
        <button class="glass-btn" onmouseover="moveNo(this)" onclick="moveNo(this)">NO</button>
    </div>
</div>

<script>
const particleCount = 40;
const particleContainer = document.getElementById('particles-container');
for(let i = 0; i < particleCount; i++) {
    let p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = Math.random() * 6 + 2 + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = Math.random() * 10 + 10 + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    particleContainer.appendChild(p);
}

const slides = [
    { src: "WhatsApp Image 2026-08-06 at 22.26.59.jpeg", text: "Even in these earliest echoes of youth, your endless grace and sweet smile were undeniable." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.01 (2).jpeg", text: "A heart full of love since the very beginning; your gentle spirit has always brought light to the world around you." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.00.jpeg", text: "Every quiet moment with you is a treasure, finding beauty in the simplest and most gentle of days." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.01 (1).jpeg", text: "Whether you're hiding behind the camera or taking the spotlight, your effortless style captivates me completely." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.01.jpeg", text: "Wrapped up in warmth, your radiant and playful smile is the absolute brightest thing I've ever seen." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.02 (1).jpeg", text: "Elegance woven into every thread, you wear every moment with a stunning, breathless grace." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.02 (2).jpeg", text: "That cute bicep flex, a beautiful reminder of the quiet, enduring strength I admire in you every single day." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.02.jpeg", text: "Those beautiful eyes behind your glasses, and that sweet, natural smile that makes my heart skip a beat every time." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.03 (1).jpeg", text: "Lost in your own world of music, your cute glasses and adorable smirk make me fall for you all over again." },
    { src: "WhatsApp Image 2026-08-06 at 22.27.03.jpeg", text: "Just looking at this beautiful smile, I realize how infinitely lucky I am to have you as the love of my life." }
];

let currentIndex = 0;
const imgEl = document.getElementById("current-image");
const txtEl = document.getElementById("poem-text");
const container = document.getElementById("slideshow-container");
const borders = document.getElementById("borders");
const introScreen = document.getElementById("intro-screen");
const phaseTwo = document.getElementById("phase-two");
const phaseThree = document.getElementById("phase-three");
const phaseFour = document.getElementById("phase-four");
const videoEl = document.getElementById("proposal-video");
const bgMusic = document.getElementById("bg-music");

function startExperience() {
    bgMusic.play().catch(error => console.log(error));
    
    introScreen.style.opacity = '0';
    setTimeout(() => {
        introScreen.style.visibility = 'hidden';
        container.style.opacity = '1';
        nextSlide();
    }, 1500);
}

function nextSlide() {
    if (currentIndex >= slides.length) {
        startPhaseTwo();
        return;
    }

    txtEl.classList.remove("fade-in");
    imgEl.classList.remove("fade-in");
    txtEl.classList.add("fade-out");
    imgEl.classList.add("fade-out");

    setTimeout(() => {
        imgEl.src = slides[currentIndex].src;
        txtEl.innerText = slides[currentIndex].text;
        
        txtEl.classList.remove("fade-out");
        imgEl.classList.remove("fade-out");
        txtEl.classList.add("fade-in");
        imgEl.classList.add("fade-in");

        currentIndex++;
        setTimeout(nextSlide, 6000);
    }, 1600);
}

function startPhaseTwo() {
    container.style.opacity = 0;
    setTimeout(() => {
        container.style.display = "none";
        borders.classList.add("grow-flowers");
        
        phaseTwo.style.display = "flex";
        setTimeout(() => { phaseTwo.style.opacity = 1; }, 100);
        
        setTimeout(startPhaseThree, 8000);
    }, 2000);
}

function startPhaseThree() {
    phaseTwo.style.opacity = 0;
    setTimeout(() => {
        phaseTwo.style.display = "none";
        phaseThree.style.display = "flex";
        
        bgMusic.pause();
        
        setTimeout(() => { 
            phaseThree.style.opacity = 1; 
            videoEl.play();
        }, 100);
    }, 2000);
}

videoEl.onended = function() {
    phaseThree.style.opacity = 0;
    setTimeout(() => {
        phaseThree.style.display = "none";
        borders.classList.remove("grow-flowers");
        phaseFour.style.display = "flex";
        setTimeout(() => { phaseFour.style.opacity = 1; }, 100);
    }, 2000);
};

function moveNo(btn) {
    btn.style.position = 'absolute';
    btn.style.top = Math.random() * 70 + 15 + '%';
    btn.style.left = Math.random() * 70 + 15 + '%';
}
</script>
</body>
</html>
